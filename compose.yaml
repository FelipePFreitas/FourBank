services:
  postgres:
    image: 'postgres:16-alpine'
    environment:
      - 'POSTGRES_DB=fourbank_db'
      - 'POSTGRES_USER=fourbank'
      - 'POSTGRES_PASSWORD=secret'
    ports:
      - '5432:5432'

  rabbitmq:
    image: 'rabbitmq:3-management-alpine'
    environment:
      - 'RABBITMQ_DEFAULT_USER=fourbank'
      - 'RABBITMQ_DEFAULT_PASS=secret'
    ports:
      - '5672:5672'
      - '15672:15672' # Interface gráfica web do RabbitMQ

  redis:
    image: 'redis:7-alpine'
    ports:
      - '6379:6379'