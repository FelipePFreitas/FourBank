<main class="signup-page">
  <section class="signup-card" aria-labelledby="signup-title">
    <a class="back" routerLink="/login">← Voltar para o login</a>
    <p class="eyebrow">Abra sua conta</p>
    <h1 id="signup-title">Cadastro FourBank</h1>
    <div class="type-tabs" role="tablist"><button type="button" [class.active]="tipo() === 'pf'" (click)="escolher('pf')">Pessoa física</button><button type="button" [class.active]="tipo() === 'pj'" (click)="escolher('pj')">Pessoa jurídica</button></div>
    <form [formGroup]="form" (ngSubmit)="cadastrar()">
      @if (tipo() === 'pf') { <label for="nome">Nome completo</label><input id="nome" formControlName="nome" /> <label for="dataNascimento">Data de nascimento</label><input id="dataNascimento" type="date" formControlName="dataNascimento" /> <label for="cpf">CPF</label><input id="cpf" formControlName="cpf" /> }
      @if (tipo() === 'pj') { <label for="nomeRazaoSocial">Razão social</label><input id="nomeRazaoSocial" formControlName="nomeRazaoSocial" /> <label for="nomeFantasia">Nome fantasia</label><input id="nomeFantasia" formControlName="nomeFantasia" /> <label for="documento">CNPJ</label><input id="documento" formControlName="documento" /> <label for="dataFundacao">Data de fundação</label><input id="dataFundacao" type="date" formControlName="dataFundacao" /> <label for="faturamentoAnual">Faturamento anual</label><input id="faturamentoAnual" type="number" min="0" step="0.01" formControlName="faturamentoAnual" /> }
      <label for="email">E-mail</label><input id="email" type="email" formControlName="email" autocomplete="email" /><label for="telefone">Telefone</label><input id="telefone" formControlName="telefone" />
      <fieldset formGroupName="endereco"><legend>Endereço</legend><label for="endereco">Logradouro</label><input id="endereco" formControlName="endereco" /><label for="numero">Número</label><input id="numero" formControlName="numero" /><label for="cep">CEP</label><input id="cep" formControlName="cep" /><label for="bairro">Bairro</label><input id="bairro" formControlName="bairro" /><label for="cidade">Cidade</label><input id="cidade" formControlName="cidade" /><label for="uf">UF</label><input id="uf" maxlength="2" formControlName="uf" /></fieldset>
      <fieldset><legend>Dados de acesso</legend><label for="login">Login</label><input id="login" formControlName="login" autocomplete="username" /><label for="senha">Senha</label><input id="senha" type="password" formControlName="senha" autocomplete="new-password" /></fieldset>
      @if (success()) { <div class="success" role="status">{{ success() }}</div> } @if (error()) { <div class="error" role="alert">{{ error() }}</div> }
      <button class="primary" type="submit" [disabled]="loading()">{{ loading() ? 'Cadastrando...' : 'Criar cadastro' }}</button>
    </form>
  </section>
</main>
