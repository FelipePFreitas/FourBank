<div class="shell">
  <aside class="sidebar" aria-label="Navegação principal">
    <a class="brand" routerLink="/dashboard" aria-label="FourBank, início">
      <span class="brand-mark">4</span><span>FourBank</span>
    </a>
    <nav>
      <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Visão geral</a>
      <a routerLink="/operacoes" routerLinkActive="active">Operações</a>
      <a routerLink="/historico" routerLinkActive="active">Histórico</a>
    </nav>
    <button class="logout" type="button" (click)="sair()">Sair</button>
  </aside>
  <main class="content">
    <router-outlet />
  </main>
</div>
