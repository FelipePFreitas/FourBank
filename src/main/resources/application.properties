# ===================================================================
# Aplicação
# ===================================================================
spring.application.name=FourBank
server.port=8080
server.error.include-message=always

# ===================================================================
# Spring Boot Docker Compose Support
# ===================================================================
# Detecta automaticamente o arquivo compose.yaml na raiz e injeta as 
# propriedades de conexão do Postgres, Redis e RabbitMQ sem precisar 
# configurar URLs e senhas manuais para desenvolvimento local.
spring.docker.compose.enabled=true
spring.docker.compose.lifecycle-management=start-and-stop

# ===================================================================
# Configuração de Banco de Dados (PostgreSQL via JPA/Hibernate)
# ===================================================================
# Mapeia as classes @Entity diretamente para as tabelas do PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Exibe e formata as consultas SQL executadas no console durante os testes
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# ===================================================================
# Cache (Spring Data Redis)
# ===================================================================
spring.cache.type=redis
spring.data.redis.repositories.enabled=false

# ===================================================================
# Mensageria (Spring for RabbitMQ)
# ===================================================================
# Converte automaticamente os objetos do RabbitMQ para/de JSON
spring.mvc.converters.preferred-json-mapper=jackson

# ===================================================================
# Observabilidade e Gerenciamento (Spring Boot Actuator)
# ===================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Faz o MapStruct gerar Mappers com a anotação @Component do Spring por padrão
mapstruct.defaultComponentModel=spring

# ===================================================================
# Segurança e Autenticação (JWT)
# ===================================================================
# Secret para assinar o token HMAC-SHA (deve ter no mínimo 256 bits / 32 caracteres em texto puro)
api.security.token.secret=${JWT_SECRET:4zY8xK2vN9pQ7mL1wE5rT0yU3iO6pA8sD1fG4hJ7kL0zX3cC6vB9nM2bV5cC8xZ1}

# Tempo de expiração do token em milissegundos (Exemplo: 28800000ms = 8 horas)
api.security.token.expiration=${JWT_EXPIRATION:28800000}